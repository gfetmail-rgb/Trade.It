name: Fix Fibonacci selection appearance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove endpoint handles after creation
        shell: python
        run: |
          from pathlib import Path
          p = Path('TradingChartControl.AdvancedDrawing.cs')
          s = p.read_text(encoding='utf-8')
          old = '''                var d = advancedDrawings[i];
                var pen = i == selectedAdvancedDrawingIndex ? selectedPen : normalPen;
                if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)
                    DrawAdvancedFibonacci(g, pen, labelBrush, d, plot, visibleCountForDrawing, min, max);
                else
                    DrawAdvancedText(g, pen, labelBrush, labelBack, d, plot, visibleCountForDrawing, min, max);'''
          new = '''                var d = advancedDrawings[i];
                var isSelected = i == selectedAdvancedDrawingIndex;
                var pen = isSelected ? selectedPen : normalPen;
                if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)
                    DrawAdvancedFibonacci(g, pen, labelBrush, d, plot, visibleCountForDrawing, min, max, isSelected);
                else
                    DrawAdvancedText(g, pen, labelBrush, labelBack, d, plot, visibleCountForDrawing, min, max);'''
          if old not in s: raise SystemExit('render target not found')
          s = s.replace(old, new, 1)
          old = '''        private void DrawAdvancedFibonacci(Graphics g, Pen pen, Brush labelBrush, AdvancedDrawing d, Rectangle plot, int visibleCountForDrawing, double min, double max)
        {
            var start = DataToScreen(d.X1, d.Y1, plot, visibleCountForDrawing, min, max);
            var end = DataToScreen(d.X2, d.Y2, plot, visibleCountForDrawing, min, max);
            DrawFibonacciLevels(g, pen, labelBrush, start, end);
            DrawAdvancedHandle(g, start);
            DrawAdvancedHandle(g, end);
        }'''
          new = '''        private void DrawAdvancedFibonacci(Graphics g, Pen pen, Brush labelBrush, AdvancedDrawing d, Rectangle plot, int visibleCountForDrawing, double min, double max, bool selected)
        {
            var start = DataToScreen(d.X1, d.Y1, plot, visibleCountForDrawing, min, max);
            var end = DataToScreen(d.X2, d.Y2, plot, visibleCountForDrawing, min, max);
            DrawFibonacciLevels(g, pen, labelBrush, start, end);
            if (selected)
            {
                DrawAdvancedHandle(g, start);
                DrawAdvancedHandle(g, end);
            }
        }'''
          if old not in s: raise SystemExit('fibonacci method target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradingChartControl.AdvancedDrawing.cs
          git diff --cached --quiet && exit 0
          git commit -m "Hide Fibonacci handles until selected"
          git push origin HEAD:main
