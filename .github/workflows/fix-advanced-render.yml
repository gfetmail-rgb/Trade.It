name: Fix advanced drawing render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire advanced drawing rendering into OnPaint
        shell: python
        run: |
          from pathlib import Path
          p = Path("TradingChartControl.cs")
          s = p.read_text(encoding="utf-8")
          old = "            DrawDrawings(e.Graphics, plot, visible.Count, min, max);\n\n            if (drawingInProgress"
          new = "            DrawDrawings(e.Graphics, plot, visible.Count, min, max);\n            RenderAdvancedDrawings(e.Graphics);\n\n            if (drawingInProgress"
          if old not in s:
              raise SystemExit("Target insertion point not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradingChartControl.cs
          git diff --cached --quiet && exit 0
          git commit -m "Fix advanced drawing render pipeline"
          git push origin HEAD:main
