name: Fix clear price filter buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix swapped clear-button controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''case "comparison7":\n                        ClearComparisonFilterControls(comparisonFirstComboBox1, comparisonFirstTextBox2, comparisonOperatorComboBox2, comparisonSecondComboBox1, comparisonSecondTextBox2);\n                        break;\n                    case "comparison8":\n                        ClearComparisonFilterControls(comparisonFirstComboBox2, comparisonFirstTextBox1, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonSecondTextBox1);'''
          new = '''case "comparison7":\n                        ClearComparisonFilterControls(comparisonFirstComboBox1, comparisonFirstTextBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonSecondTextBox1);\n                        break;\n                    case "comparison8":\n                        ClearComparisonFilterControls(comparisonFirstComboBox2, comparisonFirstTextBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonSecondTextBox2);'''
          if old not in s:
              raise SystemExit('expected code not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git commit -m "Fix individual clear buttons for price filters"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-clear-price-buttons.yml
          git commit -m "Remove temporary clear-button workflow"
          git push
