name: Apply chart fullscreen toggle

on:
  workflow_dispatch:
  push:
    paths:
      - grid-repair-trigger.txt

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainForm
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')

          old = '            Load += MainForm_Portfolios_Load;\n\n            AttachOhlcChangeFilterEvents();'
          new = '            Load += MainForm_Portfolios_Load;\n            fullScreenChartButton.Click += FullScreenChartButton_Click;\n\n            AttachOhlcChangeFilterEvents();'
          if old not in s:
              raise SystemExit('Constructor target not found')
          s = s.replace(old, new, 1)

          old = '        protected override void OnHandleCreated(EventArgs e)\n'
          new = '''        private void FullScreenChartButton_Click(object? sender, EventArgs e)\n        {\n            mainSplitContainer.Panel1Collapsed = !mainSplitContainer.Panel1Collapsed;\n            fullScreenChartButton.Text = mainSplitContainer.Panel1Collapsed ? "بازگشت" : "تمام صفحه";\n        }\n\n        protected override void OnHandleCreated(EventArgs e)\n'''
          if old not in s:
              raise SystemExit('Method insertion target not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8-sig')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git commit -m "Add chart fullscreen toggle" || true
          git rm .github/workflows/apply-chart-fullscreen-toggle.yml
          git checkout -- grid-repair-trigger.txt
          git add grid-repair-trigger.txt
          git commit -m "Remove temporary chart fullscreen workflow"
          git push origin main
