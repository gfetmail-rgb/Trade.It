name: build-three-point-fib
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply three-point Fibonacci fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('TradingChartControl.ExtraDrawingTools.cs')
          s = p.read_text(encoding='utf-8')
          old = '''            selectedExtraDrawingIndex = extraDrawings.Count - 1;\n'''
          new = '''            selectedExtraDrawingIndex = -1;\n'''
          if old not in s:
              raise SystemExit('AddExtraDrawing selection line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('TradingChartControl.cs')
          s = p.read_text(encoding='utf-8')
          old = '''            DrawDrawings(e.Graphics, plot, visible.Count, min, max);\n            RenderAdvancedDrawings(e.Graphics);\n'''
          new = '''            DrawDrawings(e.Graphics, plot, visible.Count, min, max);\n            RenderAdvancedDrawings(e.Graphics);\n            RenderExtraDrawings(e.Graphics);\n'''
          if old not in s:
              raise SystemExit('OnPaint drawing insertion point not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('TradingChartControl.ExtraDrawingRender.cs').write_text(r'''using System.Drawing.Drawing2D;

namespace Trade.It
{
    internal sealed partial class TradingChartControl
    {
        private void RenderExtraDrawings(Graphics g)
        {
            SyncExtraDrawingData();
            if (!TryGetExtraContext(out var plot, out var visibleCountForDrawing, out var min, out var max))
                return;

            using var normalPen = new Pen(Color.FromArgb(155, 80, 45), 1.3f);
            using var selectedPen = new Pen(Color.FromArgb(190, 55, 35), 2f);
            using var labelBrush = new SolidBrush(Color.FromArgb(35, 35, 35));
            using var labelBack = new SolidBrush(Color.FromArgb(248, 248, 248));
            using var previewPen = new Pen(Color.FromArgb(155, 80, 45), 1.2f) { DashStyle = DashStyle.Dash };

            for (var i = 0; i < extraDrawings.Count; i++)
            {
                var d = extraDrawings[i];
                var selected = i == selectedExtraDrawingIndex;
                var pen = selected ? selectedPen : normalPen;

                if (d.Tool == ExtraDrawingTool.Pitchfork)
                    DrawPitchforkForRender(g, pen, d, plot, visibleCountForDrawing, min, max, selected);
                else if (d.Tool == ExtraDrawingTool.FibonacciExtension)
                    DrawFibonacciExtensionForRender(g, pen, labelBrush, d, plot, visibleCountForDrawing, min, max, selected);
                else
                    DrawMeasureForRender(g, pen, labelBrush, labelBack, d, plot, visibleCountForDrawing, min, max, selected);
            }

            if (extraDrawingInProgress && ExtraDrawingActive && extraDrawingPoints.Count > 0)
            {
                if (activeExtraDrawingTool == ExtraDrawingTool.Measure)
                    DrawMeasurePreview(g, previewPen, labelBrush, extraDrawingPoints[0], extraDrawingCurrentPoint, plot);
                else if (activeExtraDrawingTool == ExtraDrawingTool.Pitchfork)
                    DrawPitchforkPreview(g, previewPen, extraDrawingPoints, extraDrawingCurrentPoint, plot);
                else
                    DrawFibonacciExtensionPreview(g, previewPen, extraDrawingPoints, extraDrawingCurrentPoint, plot);
            }
        }

        private void DrawPitchforkForRender(Graphics g, Pen pen, ExtraDrawing d, Rectangle plot, int visibleCount, double min, double max, bool selected)
        {
            var p1 = DataToScreen(d.X1, d.Y1, plot, visibleCount, min, max);
            var p2 = DataToScreen(d.X2, d.Y2, plot, visibleCount, min, max);
            var p3 = DataToScreen(d.X3, d.Y3, plot, visibleCount, min, max);
            DrawPitchforkGeometry(g, pen, p1, p2, p3, plot);
            if (selected)
            {
                DrawHandle(g, p1);
                DrawHandle(g, p2);
                DrawHandle(g, p3);
            }
        }

        private void DrawFibonacciExtensionForRender(Graphics g, Pen pen, Brush labelBrush, ExtraDrawing d, Rectangle plot, int visibleCount, double min, double max, bool selected)
        {
            var a = DataToScreen(d.X1, d.Y1, plot, visibleCount, min, max);
            var b = DataToScreen(d.X2, d.Y2, plot, visibleCount, min, max);
            var c = DataToScreen(d.X3, d.Y3, plot, visibleCount, min, max);
            var dy = b.Y - a.Y;
            var levels = new[] { 0f, 0.382f, 0.618f, 1f, 1.272f, 1.618f, 2.618f };

            g.DrawLine(pen, a, b);
            g.DrawLine(pen, b, c);

            foreach (var level in levels)
            {
                var y = c.Y + dy * level;
                g.DrawLine(pen, c.X, y, plot.Right, y);
                var text = level switch
                {
                    0f => "0%",
                    0.382f => "38.2%",
                    0.618f => "61.8%",
                    1f => "100%",
                    1.272f => "127.2%",
                    1.618f => "161.8%",
                    _ => "261.8%"
                };
                g.DrawString(text, SystemFonts.DefaultFont, labelBrush, Math.Min(c.X + 4f, plot.Right - 48f), y - 8f);
            }

            if (selected)
            {
                DrawHandle(g, a);
                DrawHandle(g, b);
                DrawHandle(g, c);
            }
        }

        private void DrawMeasureForRender(Graphics g, Pen pen, Brush labelBrush, Brush labelBack, ExtraDrawing d, Rectangle plot, int visibleCount, double min, double max, bool selected)
        {
            var a = DataToScreen(d.X1, d.Y1, plot, visibleCount, min, max);
            var b = DataToScreen(d.X2, d.Y2, plot, visibleCount, min, max);
            g.DrawLine(pen, a, b);

            var text = $"Δ قیمت: {d.Y2 - d.Y1:N2}    Δ کندل: {Math.Abs(d.X2 - d.X1):N1}";
            using var font = new Font(SystemFonts.DefaultFont.FontFamily, 9f);
            var size = g.MeasureString(text, font);
            var x = Math.Max(plot.Left + 4f, Math.Min((a.X + b.X) / 2f, plot.Right - size.Width - 8f));
            var y = Math.Max(plot.Top + 4f, Math.Min((a.Y + b.Y) / 2f - size.Height - 4f, plot.Bottom - size.Height - 4f));
            var rect = new RectangleF(x, y, size.Width + 8f, size.Height + 4f);
            g.FillRectangle(labelBack, rect);
            g.DrawRectangle(pen, rect.X, rect.Y, rect.Width, rect.Height);
            g.DrawString(text, font, labelBrush, x + 4f, y + 2f);

            if (selected)
            {
                DrawHandle(g, a);
                DrawHandle(g, b);
            }
        }
    }
}
''', encoding='utf-8')

          # Remove this one-shot workflow from the resulting commit.
          wf = Path('.github/workflows/build-three-point-fib.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradingChartControl.cs TradingChartControl.ExtraDrawingTools.cs TradingChartControl.ExtraDrawingRender.cs .github/workflows/build-three-point-fib.yml
          git commit -m "Implement three-point Fibonacci rendering"
          git push origin main
