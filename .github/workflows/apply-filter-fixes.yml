name: Apply filter fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          main = Path('MainForm.cs')
          text = main.read_text(encoding='utf-8-sig')

          old = '''        private void ApplyTradingStatusFilter()\n        {\n            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))\n            {\n                UpdateFilterCounts(0, 0);\n                return;\n            }\n\n            var symbols = (definition.Symbols ?? new List<string>())\n                .Where(s => !string.IsNullOrWhiteSpace(s))\n                .Distinct(StringComparer.OrdinalIgnoreCase)\n                .ToList();\n            IEnumerable<string> filtered = symbols;\n\n            if (HasDateColumn(definition) && !statusAllRadio.Checked)\n            {\n                var todaySymbols = GetSymbolsTradedOnDate(definition, symbols, DateTime.Today.Date);\n                var showTraded = statusPositiveRadio.Checked;\n                filtered = filtered.Where(symbol => showTraded == todaySymbols.Contains(symbol));\n            }\n\n            filtered = ApplyNameFilter(filtered);\n            filtered = ApplyVolumeRatioFilter(filtered, definition);\n            filtered = ApplyPastDaysFilter(filtered, definition);\n            var result = filtered.ToList();\n            UpdateFilterCounts(result.Count, symbols.Count);\n\n            internalPortfolioUpdate = true;\n            try\n            {\n                stocksDataGridView.Rows.Clear();\n                for (var i = 0; i < result.Count; i++)\n                    stocksDataGridView.Rows.Add(i + 1, symbols[i], string.Empty, false);\n            }\n            finally\n            {\n                internalPortfolioUpdate = false;\n            }\n\n            selectAllCheckBox.Checked = false;\n            selectNoneCheckBox.Checked = result.Count > 0;\n            UpdateSelectionControls();\n            _ = LoadLatestTradeDatesAsync(definition, result, ++latestTradeDateLoadVersion);\n        }'''
          # The exact current block is taken from main; if it differs, stop instead of overwriting.
          if old not in text:
              old = '''        private void ApplyTradingStatusFilter()\n        {\n            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))\n            {\n                UpdateFilterCounts(0, 0);\n                return;\n            }\n\n            var symbols = (definition.Symbols ?? new List<string>())\n                .Where(s => !string.IsNullOrWhiteSpace(s))\n                .Distinct(StringComparer.OrdinalIgnoreCase)\n                .ToList();\n            IEnumerable<string> filtered = symbols;\n\n            if (HasDateColumn(definition) && !statusAllRadio.Checked)\n            {\n                var todaySymbols = GetSymbolsTradedOnDate(definition, symbols, DateTime.Today.Date);\n                var showTraded = statusPositiveRadio.Checked;\n                filtered = filtered.Where(symbol => showTraded == todaySymbols.Contains(symbol));\n            }\n\n            filtered = ApplyNameFilter(filtered);\n            filtered = ApplyVolumeRatioFilter(filtered, definition);\n            filtered = ApplyPastDaysFilter(filtered, definition);\n            var result = filtered.ToList();\n            UpdateFilterCounts(result.Count, symbols.Count);\n\n            internalPortfolioUpdate = true;\n            try\n            {\n                stocksDataGridView.Rows.Clear();\n                for (var i = 0; i < result.Count; i++)\n                    stocksDataGridView.Rows.Add(i + 1, result[i], string.Empty, false);\n            }\n            finally\n            {\n                internalPortfolioUpdate = false;\n            }\n\n            selectAllCheckBox.Checked = false;\n            selectNoneCheckBox.Checked = result.Count > 0;\n            UpdateSelectionControls();\n            _ = LoadLatestTradeDatesAsync(definition, result, ++latestTradeDateLoadVersion);\n        }'''
          if old not in text:
              raise SystemExit('ApplyTradingStatusFilter block not found')
          text = text.replace(old, '        private void ApplyTradingStatusFilter() => ApplyAllFiltersToGrid();', 1)

          start = text.index('        private void ApplyComparisonFiltersToGrid()')
          end = text.index('\n        private IEnumerable<string> GetDisplayedGridSymbols()', start)
          replacement = '''        private void ApplyComparisonFiltersToGrid() => ApplyAllFiltersToGrid();

        private void ApplyAllFiltersToGrid()
        {
            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))
            {
                UpdateFilterCounts(0, 0);
                return;
            }

            var symbols = (definition.Symbols ?? new List<string>()).Where(s => !string.IsNullOrWhiteSpace(s)).Distinct(StringComparer.OrdinalIgnoreCase).ToList();
            IEnumerable<string> filtered = symbols;

            if (HasDateColumn(definition) && !statusAllRadio.Checked)
            {
                var todaySymbols = GetSymbolsTradedOnDate(definition, symbols, DateTime.Today.Date);
                var showTraded = statusPositiveRadio.Checked;
                filtered = filtered.Where(symbol => showTraded == todaySymbols.Contains(symbol));
            }

            filtered = ApplyNameFilter(filtered);
            filtered = ApplyVolumeRatioFilter(filtered, definition);
            filtered = ApplyPastDaysFilter(filtered, definition);

            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonFirstTextBox1, comparisonSecondTextBox1);
            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonFirstTextBox2, comparisonSecondTextBox2);
            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox3, comparisonOperatorComboBox3, comparisonSecondComboBox3, comparisonFirstTextBox3, comparisonSecondTextBox3);

            if (IsOhlcChangeFilterActive())
            {
                var field = NormalizeOhlcChangeField(ohlcChangeFieldComboBox.SelectedItem?.ToString());
                var n = int.Parse(NormalizeTradingDigits(ohlcChangeDaysTextBox.Text).Trim(), CultureInfo.InvariantCulture);
                var percent = double.Parse(NormalizeTradingDigits(ohlcChangePercentTextBox.Text).Trim(), CultureInfo.InvariantCulture);
                var op = GetOhlcChangeOperator();
                filtered = filtered.Where(symbol => TryGetOhlcChange(definition, symbol, field, n, out var changePercent) && CompareNumeric(changePercent, percent, op));
            }

            var result = filtered.ToList();
            UpdateFilterCounts(result.Count, symbols.Count);
            internalPortfolioUpdate = true;
            try
            {
                stocksDataGridView.Rows.Clear();
                for (var i = 0; i < result.Count; i++) stocksDataGridView.Rows.Add(i + 1, result[i], string.Empty, false);
            }
            finally { internalPortfolioUpdate = false; }
            selectAllCheckBox.Checked = false;
            selectNoneCheckBox.Checked = result.Count > 0;
            UpdateSelectionControls();
            _ = LoadLatestTradeDatesAsync(definition, result, ++latestTradeDateLoadVersion);
        }
'''
          text = text[:start] + replacement + text[end:]

          old = '''        private bool HasAnyActiveComparisonFilter() =>\n            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonFirstTextBox1, comparisonSecondTextBox1) ||\n            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonFirstTextBox1, comparisonSecondTextBox1);'''
          new = '''        private bool HasAnyActiveComparisonFilter() =>\n            IsComparisonFilterActive(comparisonFirstComboBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonFirstTextBox1, comparisonSecondTextBox1) ||\n            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonFirstTextBox2, comparisonSecondTextBox2) ||\n            IsComparisonFilterActive(comparisonFirstComboBox3, comparisonOperatorComboBox3, comparisonSecondComboBox3, comparisonFirstTextBox3, comparisonSecondTextBox3) ||\n            IsOhlcChangeFilterActive();'''
          if old not in text: raise SystemExit('HasAnyActiveComparisonFilter block not found')
          text = text.replace(old, new, 1)

          old = '''        private void ApplyOhlcChangeFilterToGrid()\n        {\n            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition)) return;\n            var field = NormalizeOhlcChangeField(ohlcChangeFieldComboBox.SelectedItem?.ToString());\n            if (string.IsNullOrEmpty(field)) return;\n            if (!int.TryParse(NormalizeTradingDigits(ohlcChangeDaysTextBox.Text).Trim(), NumberStyles.Integer, CultureInfo.InvariantCulture, out var n) || n <= 0) return;\n            if (!double.TryParse(NormalizeTradingDigits(ohlcChangePercentTextBox.Text).Trim(), NumberStyles.Float, CultureInfo.InvariantCulture, out var percent) || percent < 0) return;\n            var op = GetOhlcChangeOperator();\n            if (string.IsNullOrWhiteSpace(op)) return;\n            var symbols = GetDisplayedGridSymbolsForOhlcFilter().ToList();\n            var result = symbols.Where(symbol => TryGetOhlcChange(definition, symbol, field, n, out var changePercent) && CompareNumeric(changePercent, percent, op)).ToList();\n            var totalCount = (definition.Symbols ?? new List<string>()).Where(s => !string.IsNullOrWhiteSpace(s)).Distinct(StringComparer.OrdinalIgnoreCase).Count();\n            UpdateFilterCounts(result.Count, totalCount);\n            internalPortfolioUpdate = true;\n            try\n            {\n                stocksDataGridView.Rows.Clear();\n                for (var i = 0; i < result.Count; i++) stocksDataGridView.Rows.Add(i + 1, result[i], "", false);\n            }\n            finally { internalPortfolioUpdate = false; }\n            selectAllCheckBox.Checked = false; selectNoneCheckBox.Checked = result.Count > 0; UpdateSelectionControls();\n        }'''
          new = '''        private void ApplyOhlcChangeFilterToGrid() => ApplyAllFiltersToGrid();'''
          if old not in text: raise SystemExit('ApplyOhlcChangeFilterToGrid block not found')
          text = text.replace(old, new, 1)

          # Allow negative percentage thresholds because the filter is a signed percentage change.
          text = text.replace('out var percent) || percent < 0) return false;', 'out var percent)) return false;', 1)
          text = text.replace('out var percent) || percent < 0) return;', 'out var percent)) return;', 1)

          main.write_text(text, encoding='utf-8-sig')

          designer = Path('PortfolioDefinitionForm.Designer.cs')
          dtext = designer.read_text(encoding='utf-8-sig')
          old_date = 'dateFormatComboBox.Items.AddRange(new object[] { "YYYYMMDD", "YYYY-MM-DD", "YYYY/MM/DD" });'
          new_date = 'dateFormatComboBox.Items.AddRange(new object[] { "YYYYMMDD", "YYYY-MM-DD", "YYYY/MM/DD", "YYYY.MM.DD" });'
          if old_date in dtext:
              designer.write_text(dtext.replace(old_date, new_date, 1), encoding='utf-8-sig')
          elif new_date not in dtext:
              raise SystemExit('Date format list not found')

      - name: Verify and build
        run: |
          git diff --check
          dotnet build --configuration Release

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs PortfolioDefinitionForm.Designer.cs
          git rm .github/workflows/apply-filter-fixes.yml
          git commit -m "Fix combined filters and add dotted date format"
          git push origin HEAD:main
