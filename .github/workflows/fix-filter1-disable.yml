name: Temporary Filter 1 Fix

on:
  push:
    branches: [fix-filter1-disable]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''        private void ApplyTradingStatusFilter()\n        {\n            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))\n            {\n                UpdateFilterCounts(0, 0);\n                return;\n            }\n\n            UpdateFilterControlAvailability();\n            var symbols ='''
          new = '''        private void ApplyTradingStatusFilter()\n        {\n            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))\n            {\n                UpdateFilterCounts(0, 0);\n                return;\n            }\n\n            var symbols ='''
          if old not in s:
              raise SystemExit('Expected ApplyTradingStatusFilter block was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-filter1-disable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs .github/workflows/fix-filter1-disable.yml
          git commit -m "Fix filter 1 availability when switching status" || exit 0
          git push origin HEAD:fix-filter1-disable