name: Fix name filter selection

on:
  push:
    paths:
      - '.github/workflows/fix-name-filter-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainForm.cs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MainForm.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            var mode = nameComboBox.SelectedIndex;\n            if (mode < 0) mode = 0;\n            return symbols.Where(symbol => MatchesNameFilter(symbol, phrase, mode));'''
          new = '''            var mode = nameComboBox.SelectedIndex;\n            if (mode < 0)\n                return symbols;\n            return symbols.Where(symbol => MatchesNameFilter(symbol, phrase, mode));'''
          if old not in text:
              raise SystemExit('NAME_FILTER_SELECTION_BLOCK_NOT_FOUND')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git commit -m "Require name filter mode selection"
          git push
