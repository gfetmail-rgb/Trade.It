name: Fix name filter selection
on:
  push:
    branches:
      - fix-name-filter-selection
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix name filter selection reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8')
          old = '''            if (controlTabControl.SelectedTab == tabPage2)\n            {\n                nameComboBox.SelectedIndex = -1;\n                UpdateFilterControlAvailability();\n            }'''
          new = '''            if (controlTabControl.SelectedTab == tabPage2)\n            {\n                UpdateFilterControlAvailability();\n            }'''
          if old not in s:
              raise SystemExit('Expected FilterTabSelected block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- MainForm.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git commit -m "Fix name filter selection persistence"
          git rm .github/workflows/fix-name-filter-selection.yml
          git commit -m "Remove temporary name filter fix workflow"
          git push origin HEAD:fix-name-filter-selection