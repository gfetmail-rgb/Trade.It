name: Fix name filter order

on:
  push:
    paths:
      - grid-repair-trigger.txt

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch name filter logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''                0 => found,\n                1 => found && index == 0,\n                2 => found && index + phrase.Length == name.Length,\n                3 => found && index > 0 && index + phrase.Length < name.Length,\n                4 => !found,'''
          new = '''                0 => found && index == 0,\n                1 => found && index + phrase.Length == name.Length,\n                2 => found && index > 0 && index + phrase.Length < name.Length,\n                3 => found,\n                4 => !found,'''
          if old not in s:
              raise SystemExit('Name filter switch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8-sig')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git commit -m "Align name filter logic with combo order"
          git rm .github/workflows/fix-name-filter-order.yml
          printf '%s' 'chart fullscreen toggle trigger' > grid-repair-trigger.txt
          git add grid-repair-trigger.txt
          git commit -m "Remove temporary name filter workflow"
          git push origin fix-name-filter-order
