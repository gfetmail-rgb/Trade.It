name: Final UI migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply the prepared UI migration script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/move-ui-to-designer.yml').read_text(encoding='utf-8-sig').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == 'run: |')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].startswith('      - name: Build'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start + 1:end])
          exec(compile(script, 'move-ui-to-designer.py', 'exec'), {'__name__': '__main__'})

          designer = Path('MainForm.Designer.cs')
          designer.write_text('\n'.join(line.rstrip() for line in designer.read_text(encoding='utf-8-sig').splitlines()) + '\n', encoding='utf-8-sig')

      - name: Restore
        run: dotnet restore Trade.It.sln -p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build Trade.It.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-ui-to-designer.yml .github/workflows/finalize-ui-designer.yml .github/workflows/complete-ui-migration.yml .github/workflows/final-ui-migration.yml
          git add MainForm.Designer.cs MainForm.cs
          git diff --cached --stat
          git commit -m "Move MainForm UI controls into Designer"
          git push origin HEAD:main
