name: Fix filter controls layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair filter control positions
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8-sig')
          for suffix in ['', '6', '7', '8']:
              name = f'label5_{suffix}' if suffix else 'label5'
              s = s.replace(f'            {name}.Location = new Point(319, 36);', f'            {name}.Location = new Point(250, 36);')
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-filter-controls.yml
          git add MainForm.Designer.cs .github/workflows/fix-filter-controls.yml
          git commit -m "Fix filter controls layout"
          git push origin HEAD:main
