name: Add individual filter clear buttons
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  modify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply code change
        run: python3 .github/filter_patch.py
      - name: Commit code change and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm.cs
          git commit -m 'Add individual filter clear buttons'
          git push origin main
          git rm .github/filter_patch.py .github/workflows/add-individual-filter-clear-buttons.yml
          git commit -m 'Remove temporary filter workflow'
          git push origin main
