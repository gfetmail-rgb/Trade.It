name: Fix WinForms UI layout

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI layout fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path("MainForm.Designer.cs")
          text = main.read_text(encoding="utf-8")

          text = text.replace(
              'mainSplitContainer.Name = "mainSplitContainer";\n            mainSplitContainer.Panel1.Controls.Add(controlTabControl);',
              'mainSplitContainer.Name = "mainSplitContainer";\n            mainSplitContainer.RightToLeft = RightToLeft.No;\n            mainSplitContainer.Panel1.Controls.Add(controlTabControl);',
              1)

          text = text.replace(
              'controlTabControl.Name = "controlTabControl";\n',
              'controlTabControl.Name = "controlTabControl";\n            controlTabControl.RightToLeft = RightToLeft.Yes;\n            controlTabControl.RightToLeftLayout = false;\n',
              1)

          text = text.replace(
              'stocksTabPage.Name = "stocksTabPage";\n',
              'stocksTabPage.Name = "stocksTabPage";\n            stocksTabPage.RightToLeft = RightToLeft.Yes;\n            stocksTabPage.RightToLeftLayout = false;\n',
              1)

          text = text.replace(
              'tabPage2.Name = "tabPage2";\n',
              'tabPage2.Name = "tabPage2";\n            tabPage2.RightToLeft = RightToLeft.Yes;\n            tabPage2.RightToLeftLayout = false;\n',
              1)

          main.write_text(text, encoding="utf-8")

          pm = Path("PortfolioManagementForm.Designer.cs")
          text = pm.read_text(encoding="utf-8")

          text = text.replace(
              'symbolsTitleLabel.Location = new Point(-13, 352);',
              'symbolsTitleLabel.Location = new Point(20, 352);',
              1)
          text = text.replace(
              'symbolsTitleLabel.Size = new Size(136, 34);',
              'symbolsTitleLabel.Size = new Size(1368, 34);',
              1)
          text = text.replace(
              'RightToLeftLayout = true;',
              'RightToLeftLayout = false;',
              1)

          pm.write_text(text, encoding="utf-8")

      - name: Commit UI fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-ui.yml
          git add MainForm.Designer.cs PortfolioManagementForm.Designer.cs .github/workflows/fix-ui.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix WinForms RTL and portfolio preview layout"
          git push origin HEAD:main
