name: Fix filter label and stock grid resize

on:
  push:
    branches: [ main ]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8')

          s = s.replace('        private Label? filterCountLabel;\n', '')

          old = '''        private void InitializeFilterStatusDisplay()\n        {\n            var parent = clearFiltersButton.Parent;\n            if (parent == null)\n                return;\n\n            ConfigureFilterComboBoxes();\n\n            clearFiltersButton.Width = 100;\n            clearFiltersButton.Location = new Point(8, clearFiltersButton.Top);\n\n            filterCountLabel = new Label\n            {\n                AutoSize = false,\n                Width = 205,\n                Height = 36,\n                Text = "کل: ۰    پیدا شده: ۰",\n                TextAlign = ContentAlignment.MiddleCenter,\n                BorderStyle = BorderStyle.None,\n                RightToLeft = RightToLeft.Yes,\n                Font = new Font("Segoe UI", 9F)\n            };\n\n            filterCountLabel.Location = new Point(clearFiltersButton.Right + 4, clearFiltersButton.Top);\n            parent.Controls.Add(filterCountLabel);\n            filterCountLabel.BringToFront();\n            clearFiltersButton.BringToFront();\n        }\n'''
          new = '''        private void InitializeFilterStatusDisplay()\n        {\n            ConfigureFilterComboBoxes();\n        }\n'''
          if old not in s:
              raise SystemExit('InitializeFilterStatusDisplay block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8')

          decl = '        private System.Windows.Forms.Button refreshButtonPortfolio;\n'
          if 'private System.Windows.Forms.Label filterCountLabel;' not in s:
              if decl not in s:
                  raise SystemExit('Designer declaration anchor not found')
              s = s.replace(decl, decl + '        private System.Windows.Forms.Label filterCountLabel;\n', 1)

          init_anchor = '            clearFiltersButton = new Button();\n'
          if '            filterCountLabel = new Label();\n' not in s:
              if init_anchor not in s:
                  raise SystemExit('Designer initialization anchor not found')
              s = s.replace(init_anchor, init_anchor + '            filterCountLabel = new Label();\n', 1)

          controls_anchor = '            tabPage2.Controls.Add(clearFiltersButton);\n'
          if '            tabPage2.Controls.Add(filterCountLabel);\n' not in s:
              if controls_anchor not in s:
                  raise SystemExit('tabPage2 controls anchor not found')
              s = s.replace(controls_anchor, controls_anchor + '            tabPage2.Controls.Add(filterCountLabel);\n', 1)

          label_anchor = '            // \n            // ohlcChangeFilterGroup\n'
          label_block = '''            // \n            // filterCountLabel\n            // \n            filterCountLabel.AutoSize = false;\n            filterCountLabel.BorderStyle = BorderStyle.None;\n            filterCountLabel.Font = new Font("Segoe UI", 9F);\n            filterCountLabel.Location = new Point(150, 858);\n            filterCountLabel.Name = "filterCountLabel";\n            filterCountLabel.RightToLeft = RightToLeft.Yes;\n            filterCountLabel.Size = new Size(205, 36);\n            filterCountLabel.TabIndex = 11;\n            filterCountLabel.Text = "کل: ۰    پیدا شده: ۰";\n            filterCountLabel.TextAlign = ContentAlignment.MiddleCenter;\n            // \n'''
          if '// filterCountLabel\n' not in s:
              if label_anchor not in s:
                  raise SystemExit('Designer label location anchor not found')
              s = s.replace(label_anchor, label_block + label_anchor, 1)

          grid_old = '            stocksDataGridView.AllowUserToOrderColumns = true;\n            stocksDataGridView.AllowUserToResizeRows = false;\n            stocksDataGridView.Anchor = AnchorStyles.Top | AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            stocksDataGridView.AutoSizeColumnsMode = DataGridViewAutoSizeColumnsMode.ColumnHeader;\n'
          grid_new = '            stocksDataGridView.AllowUserToOrderColumns = true;\n            stocksDataGridView.AllowUserToResizeColumns = true;\n            stocksDataGridView.AllowUserToResizeRows = false;\n            stocksDataGridView.Anchor = AnchorStyles.Top | AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            stocksDataGridView.AutoSizeColumnsMode = DataGridViewAutoSizeColumnsMode.None;\n'
          if grid_old not in s:
              raise SystemExit('Grid settings block not found')
          s = s.replace(grid_old, grid_new, 1)
          p.write_text(s, encoding='utf-8')

          print('Focused fixes applied')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs MainForm.Designer.cs
          git diff --cached --quiet && exit 0
          git commit -m "Fix filter count label and stock grid column resizing"
          git push origin main

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-filter-label-and-grid.yml
          git add .github/workflows/fix-filter-label-and-grid.yml
          git commit -m "Remove temporary focused fix workflow"
          git push origin main
