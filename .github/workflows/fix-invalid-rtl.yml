name: Fix invalid TabPage RTL properties

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unsupported TabPage properties
        shell: python
        run: |
          from pathlib import Path
          p = Path("MainForm.Designer.cs")
          text = p.read_text(encoding="utf-8")
          text = text.replace('            controlTabControl.RightToLeftLayout = false;\n', '', 1)
          text = text.replace('            stocksTabPage.RightToLeftLayout = false;\n', '', 1)
          text = text.replace('            tabPage2.RightToLeftLayout = false;\n', '', 1)
          p.write_text(text, encoding="utf-8")
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-invalid-rtl.yml
          git add MainForm.Designer.cs .github/workflows/fix-invalid-rtl.yml
          git commit -m "Fix unsupported TabPage RTL properties"
          git push origin HEAD:main
