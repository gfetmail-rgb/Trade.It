name: Apply precise filter fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source precisely
        shell: python
        run: |
          from pathlib import Path

          def replace_method(text, name, replacement):
              marker = '        private '
              start = text.index(marker + ('void ' if name.startswith('Apply') or name.startswith('Comparison') or name.startswith('Ohlc') else 'bool ') + name)
              brace = text.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None: raise SystemExit(f'Could not close {name}')
              return text[:start] + replacement + text[end:]

          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')

          s = replace_method(s, 'ApplyTradingStatusFilter', '''        private void ApplyTradingStatusFilter() => ApplyAllFiltersToGrid();''')

          s = replace_method(s, 'ApplyComparisonFiltersToGrid', '''        private void ApplyComparisonFiltersToGrid() => ApplyAllFiltersToGrid();''')

          # Insert the common AND pipeline immediately before GetDisplayedGridSymbols.
          anchor = '        private IEnumerable<string> GetDisplayedGridSymbols()'
          if 'private void ApplyAllFiltersToGrid()' not in s:
              common = '''        private void ApplyAllFiltersToGrid()
        {
            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition))
            {
                UpdateFilterCounts(0, 0);
                return;
            }

            var symbols = (definition.Symbols ?? new List<string>())
                .Where(s => !string.IsNullOrWhiteSpace(s))
                .Distinct(StringComparer.OrdinalIgnoreCase)
                .ToList();
            IEnumerable<string> filtered = symbols;

            if (HasDateColumn(definition) && !statusAllRadio.Checked)
            {
                var todaySymbols = GetSymbolsTradedOnDate(definition, symbols, DateTime.Today.Date);
                var showTraded = statusPositiveRadio.Checked;
                filtered = filtered.Where(symbol => showTraded == todaySymbols.Contains(symbol));
            }

            filtered = ApplyNameFilter(filtered);
            filtered = ApplyVolumeRatioFilter(filtered, definition);
            filtered = ApplyPastDaysFilter(filtered, definition);

            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonFirstTextBox1, comparisonSecondTextBox1);
            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonFirstTextBox2, comparisonSecondTextBox2);
            filtered = ApplyComparisonFilter(filtered, definition, comparisonFirstComboBox3, comparisonOperatorComboBox3, comparisonSecondComboBox3, comparisonFirstTextBox3, comparisonSecondTextBox3);

            if (IsOhlcChangeFilterActive())
            {
                var field = NormalizeOhlcChangeField(ohlcChangeFieldComboBox.SelectedItem?.ToString());
                var n = int.Parse(NormalizeTradingDigits(ohlcChangeDaysTextBox.Text).Trim(), CultureInfo.InvariantCulture);
                var percent = double.Parse(NormalizeTradingDigits(ohlcChangePercentTextBox.Text).Trim(), CultureInfo.InvariantCulture);
                var op = GetOhlcChangeOperator();
                filtered = filtered.Where(symbol => TryGetOhlcChange(definition, symbol, field, n, out var changePercent) && CompareNumeric(changePercent, percent, op));
            }

            var result = filtered.ToList();
            UpdateFilterCounts(result.Count, symbols.Count);
            internalPortfolioUpdate = true;
            try
            {
                stocksDataGridView.Rows.Clear();
                for (var i = 0; i < result.Count; i++)
                    stocksDataGridView.Rows.Add(i + 1, result[i], string.Empty, false);
            }
            finally { internalPortfolioUpdate = false; }

            selectAllCheckBox.Checked = false;
            selectNoneCheckBox.Checked = result.Count > 0;
            UpdateSelectionControls();
            _ = LoadLatestTradeDatesAsync(definition, result, ++latestTradeDateLoadVersion);
        }

'''
              s = s.replace(anchor, common + anchor, 1)

          # Make the wrapper always recompute the complete AND pipeline.
          old_wrapper = '''        private void ApplyComparisonFiltersToGridWithWaitCursor()
        {
            if (!HasAnyActiveComparisonFilter()) return;
            UseWaitCursor = true;
            Cursor.Current = Cursors.WaitCursor;
            try { Application.DoEvents(); ApplyComparisonFiltersToGrid(); }
            finally { UseWaitCursor = false; Cursor.Current = Cursors.Default; Application.DoEvents(); }
        }'''
          new_wrapper = '''        private void ApplyComparisonFiltersToGridWithWaitCursor()
        {
            UseWaitCursor = true;
            Cursor.Current = Cursors.WaitCursor;
            try { Application.DoEvents(); ApplyComparisonFiltersToGrid(); }
            finally { UseWaitCursor = false; Cursor.Current = Cursors.Default; Application.DoEvents(); }
        }'''
          if old_wrapper not in s: raise SystemExit('comparison wrapper not found')
          s = s.replace(old_wrapper, new_wrapper, 1)

          old_active = '''        private bool HasAnyActiveComparisonFilter() =>
            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonFirstTextBox1, comparisonSecondTextBox1) ||
            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonFirstTextBox1, comparisonSecondTextBox1);'''
          new_active = '''        private bool HasAnyActiveComparisonFilter() =>
            IsComparisonFilterActive(comparisonFirstComboBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonFirstTextBox1, comparisonSecondTextBox1) ||
            IsComparisonFilterActive(comparisonFirstComboBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonFirstTextBox2, comparisonSecondTextBox2) ||
            IsComparisonFilterActive(comparisonFirstComboBox3, comparisonOperatorComboBox3, comparisonSecondComboBox3, comparisonFirstTextBox3, comparisonSecondTextBox3) ||
            IsOhlcChangeFilterActive();'''
          if old_active not in s: raise SystemExit('active filter block not found')
          s = s.replace(old_active, new_active, 1)

          old_ohlc = '''        private void ApplyOhlcChangeFilterToGrid()
        {
            if (string.IsNullOrWhiteSpace(displayedPortfolioName) || !loadedPortfolios.TryGetValue(displayedPortfolioName, out var definition)) return;
            var field = NormalizeOhlcChangeField(ohlcChangeFieldComboBox.SelectedItem?.ToString());
            if (string.IsNullOrEmpty(field)) return;
            if (!int.TryParse(NormalizeTradingDigits(ohlcChangeDaysTextBox.Text).Trim(), NumberStyles.Integer, CultureInfo.InvariantCulture, out var n) || n <= 0) return;
            if (!double.TryParse(NormalizeTradingDigits(ohlcChangePercentTextBox.Text).Trim(), NumberStyles.Float, CultureInfo.InvariantCulture, out var percent) || percent < 0) return;
            var op = GetOhlcChangeOperator();
            if (string.IsNullOrWhiteSpace(op)) return;
            var symbols = GetDisplayedGridSymbolsForOhlcFilter().ToList();
            var result = symbols.Where(symbol => TryGetOhlcChange(definition, symbol, field, n, out var changePercent) && CompareNumeric(changePercent, percent, op)).ToList();
            var totalCount = (definition.Symbols ?? new List<string>()).Where(s => !string.IsNullOrWhiteSpace(s)).Distinct(StringComparer.OrdinalIgnoreCase).Count();
            UpdateFilterCounts(result.Count, totalCount);
            internalPortfolioUpdate = true;
            try
            {
                stocksDataGridView.Rows.Clear();
                for (var i = 0; i < result.Count; i++) stocksDataGridView.Rows.Add(i + 1, result[i], "", false);
            }
            finally { internalPortfolioUpdate = false; }
            selectAllCheckBox.Checked = false; selectNoneCheckBox.Checked = result.Count > 0; UpdateSelectionControls();
        }'''
          if old_ohlc in s:
              s = s.replace(old_ohlc, '''        private void ApplyOhlcChangeFilterToGrid() => ApplyAllFiltersToGrid();''', 1)
          else:
              raise SystemExit('OHLC apply block not found')

          s = s.replace('out var percent) || percent < 0) return false;', 'out var percent)) return false;', 1)
          s = s.replace('out var percent) || percent < 0) return;', 'out var percent)) return;', 1)
          p.write_text(s, encoding='utf-8-sig')

          d = Path('PortfolioDefinitionForm.Designer.cs')
          ds = d.read_text(encoding='utf-8-sig')
          date_item = 'dateFormatComboBox.Items.AddRange(new object[] { "YYYYMMDD", "YYYY-MM-DD", "YYYY/MM/DD", "YYYY.MM.DD" });'
          if date_item not in ds:
              old_date = 'dateFormatComboBox.Items.AddRange(new object[] { "YYYYMMDD", "YYYY-MM-DD", "YYYY/MM/DD" });'
              if old_date not in ds: raise SystemExit('date format list not found')
              ds = ds.replace(old_date, date_item, 1)
              d.write_text(ds, encoding='utf-8-sig')

      - name: Verify and build
        run: |
          git diff --check
          dotnet build --configuration Release

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs PortfolioDefinitionForm.Designer.cs
          git rm .github/workflows/apply-filter-fixes2.yml
          git commit -m "Fix combined filters and dotted date format"
          git push origin HEAD:main
