name: Fix identifier designer parent

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix Designer control hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8-sig')

          # The controls already exist as Designer fields/instances. Ensure their actual parents are Designer-owned.
          tab3 = '            tabPage3.Controls.Add(identifierMainGroup);\n            tabPage3.Controls.Add(identifierButtonsPanel);\n'
          marker3 = '            // tabPage3\n            //\n'
          if 'tabPage3.Controls.Add(identifierMainGroup);' not in s:
              s = s.replace(marker3, marker3 + tab3, 1)

          markets = '            marketsTabPage.Controls.Add(marketsMainGroup);\n'
          markerm = '            // marketsTabPage\n            //\n'
          if 'marketsTabPage.Controls.Add(marketsMainGroup);' not in s:
              s = s.replace(markerm, markerm + markets, 1)

          clear = {
              'filterTradingClearButton':'tradingStatusGroup',
              'filterNameClearButton':'nameFilterGroup',
              'filterVolumeClearButton':'volumeRatioGroup',
              'filterPastDaysClearButton':'pastDaysGroup',
              'filterComparison7ClearButton':'comparisonGroup7',
              'filterComparison8ClearButton':'comparisonGroup8',
              'filterComparison9ClearButton':'groupBox3',
              'filterOhlcChangeClearButton':'ohlcChangeFilterGroup',
          }
          # Add each existing Designer clear button to its group if not already present.
          for button, parent in clear.items():
              line = f'            {parent}.Controls.Add({button});\n'
              if line not in s:
                  # Insert immediately before the MainForm section, after all control initialization.
                  idx = s.find('            // MainForm\n')
                  if idx < 0: raise SystemExit(f'MainForm marker missing for {button}')
                  s = s[:idx] + line + s[idx:]

          # The eight buttons must be fully configured in Designer, not runtime.
          configs = {
              'filterTradingClearButton':'trading',
              'filterNameClearButton':'name',
              'filterVolumeClearButton':'volume',
              'filterPastDaysClearButton':'pastDays',
              'filterComparison7ClearButton':'comparison7',
              'filterComparison8ClearButton':'comparison8',
              'filterComparison9ClearButton':'comparison9',
              'filterOhlcChangeClearButton':'ohlcChange',
          }
          for button, key in configs.items():
              if f'{button}.Text = "پاک";' not in s:
                  idx = s.find('            // MainForm\n')
                  block = (f'            {button}.Anchor = AnchorStyles.Top | AnchorStyles.Left;\n'
                           f'            {button}.Font = new Font("Segoe UI", 8.5F);\n'
                           f'            {button}.Location = new Point(8, 2);\n'
                           f'            {button}.Name = "{button}";\n'
                           f'            {button}.RightToLeft = RightToLeft.Yes;\n'
                           f'            {button}.Size = new Size(42, 24);\n'
                           f'            {button}.TabStop = false;\n'
                           f'            {button}.Tag = "{key}";\n'
                           f'            {button}.Text = "پاک";\n'
                           f'            {button}.UseVisualStyleBackColor = true;\n'
                           f'            {button}.Click += IndividualFilterClearButton_Click;\n')
                  if idx < 0: raise SystemExit(f'MainForm marker missing for {button} config')
                  s = s[:idx] + block + s[idx:]

          p.write_text(s, encoding='utf-8-sig')
          PY

          # Remove the runtime-created identifier UI block from MainForm.cs.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MainForm.cs')
          s = p.read_text(encoding='utf-8-sig')
          start = s.find('            tabPage3.Controls.Clear();')
          end = s.find('            portfolioComboBox.SelectedIndexChanged += PortfolioComboBox_SelectedIndexChanged;', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
              p.write_text(s, encoding='utf-8-sig')
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.Designer.cs MainForm.cs
          git rm .github/workflows/fix-identifier-designer.yml
          git commit -m "Move filter and tab controls fully into Designer"
          git push origin HEAD:main
