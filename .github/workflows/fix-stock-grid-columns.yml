name: Fix stock grid columns
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stock grid columns
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8-sig')
          target = '            stocksDataGridView.TabIndex = 0;\n'
          replacement = target + '            stocksDataGridView.Columns.AddRange(new DataGridViewColumn[] { rowColumn, symbolColumn, lastTradeColumn, selectColumn });\n'
          if replacement not in s:
              if target not in s:
                  raise SystemExit('stocksDataGridView TabIndex block not found')
              s = s.replace(target, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.Designer.cs
          git commit -m "Restore four stock grid columns" || true
          git rm .github/workflows/fix-stock-grid-columns.yml
          git commit -m "Remove temporary grid repair workflow"
          git push origin HEAD:main
