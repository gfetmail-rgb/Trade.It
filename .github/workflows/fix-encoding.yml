name: Fix Encoding namespace

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add System.Text using
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PortfolioManagementForm.cs')
          s = p.read_text(encoding='utf-8')
          if 'using System.Text;\n' not in s:
              s = s.replace('using System.Text.Json;\n', 'using System.Text;\nusing System.Text.Json;\n', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PortfolioManagementForm.cs
          git diff --cached --quiet || git commit -m 'Fix missing Encoding namespace'
          git rm .github/workflows/fix-encoding.yml
          git commit -m 'Remove temporary encoding fix workflow'
          git push
