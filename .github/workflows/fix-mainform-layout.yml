name: Fix main form layout
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair stock controls and RTL layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8-sig')

          # Restore the stable stock-controls container used before the preview work.
          decl = '''        private System.Windows.Forms.Panel stockControlsPanel;\n        private System.Windows.Forms.FlowLayoutPanel stockButtonsPanel;\n        private System.Windows.Forms.FlowLayoutPanel stockOptionsPanel;\n'''
          marker = '        private System.Windows.Forms.Button navigationButton;\n'
          if 'private System.Windows.Forms.Panel stockControlsPanel;' not in s:
              if marker not in s: raise SystemExit('stock declaration anchor not found')
              s = s.replace(marker, decl + marker, 1)

          init = '''            stockControlsPanel = new Panel();\n            stockButtonsPanel = new FlowLayoutPanel();\n            stockOptionsPanel = new FlowLayoutPanel();\n'''
          marker = '            navigationButton = new Button();\n'
          if '            stockControlsPanel = new Panel();' not in s:
              if marker not in s: raise SystemExit('stock init anchor not found')
              s = s.replace(marker, init + marker, 1)

          marker = '            groupBox1.SuspendLayout();\n'
          if '            stockControlsPanel.SuspendLayout();' not in s:
              if marker not in s: raise SystemExit('suspend anchor not found')
              s = s.replace(marker, marker + '            stockControlsPanel.SuspendLayout();\n            stockButtonsPanel.SuspendLayout();\n            stockOptionsPanel.SuspendLayout();\n', 1)

          # The current stock tab must use the stable two-row control container.
          start = s.index('            groupBox1.Anchor = AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;')
          end = s.index('            rowColumn.HeaderText = "ردیف";', start)
          replacement = '''            stockControlsPanel.Anchor = AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            stockControlsPanel.Location = new Point(8, 512);\n            stockControlsPanel.Size = new Size(350, 105);\n            stockButtonsPanel.Dock = DockStyle.Top;\n            stockButtonsPanel.Height = 38;\n            stockButtonsPanel.FlowDirection = FlowDirection.LeftToRight;\n            stockButtonsPanel.WrapContents = false;\n            stockButtonsPanel.Controls.Add(navigationButton);\n            stockButtonsPanel.Controls.Add(newPortfolioButton);\n            stockButtonsPanel.Controls.Add(refreshButton);\n            stockButtonsPanel.Controls.Add(deleteButton);\n            stockOptionsPanel.Dock = DockStyle.Fill;\n            stockOptionsPanel.Padding = new Padding(3, 5, 3, 3);\n            stockOptionsPanel.FlowDirection = FlowDirection.LeftToRight;\n            stockOptionsPanel.WrapContents = false;\n            stockOptionsPanel.Controls.Add(selectAllCheckBox);\n            stockOptionsPanel.Controls.Add(selectNoneCheckBox);\n            stockOptionsPanel.Controls.Add(speedLabel);\n            stockOptionsPanel.Controls.Add(navigationSpeedTextBox);\n            stockControlsPanel.Controls.Add(stockOptionsPanel);\n            stockControlsPanel.Controls.Add(stockButtonsPanel);\n\n            navigationButton.Text = "پیمایش";\n            navigationButton.Size = new Size(75, 30);\n            newPortfolioButton.Text = "سبد جدید";\n            newPortfolioButton.Size = new Size(75, 30);\n            refreshButton.Text = "تازه‌سازی";\n            refreshButton.Size = new Size(75, 30);\n            deleteButton.Text = "حذف";\n            deleteButton.Size = new Size(60, 30);\n            selectAllCheckBox.Text = "همه";\n            selectAllCheckBox.AutoSize = true;\n            selectNoneCheckBox.Text = "هیچکدام";\n            selectNoneCheckBox.AutoSize = true;\n            speedLabel.Text = "سرعت:";\n            speedLabel.AutoSize = true;\n            navigationSpeedTextBox.Size = new Size(65, 23);\n            navigationSpeedTextBox.Text = "1000";\n\n'''
          s = s[:start] + replacement + s[end:]

          old_grid = '            stocksDataGridView.Size = new Size(344, 627);\n'
          if old_grid in s:
              pass
          elif '            stocksDataGridView.Size = new Size(350, 627);\n' in s:
              s = s.replace('            stocksDataGridView.Size = new Size(350, 627);\n', '            stocksDataGridView.Size = new Size(350, 465);\n', 1)
          else:
              # Exact current dimensions from the preview migration.
              import re
              s, n = re.subn(r'            stocksDataGridView.Size = new Size\\([^;]+\\);\\n', '            stocksDataGridView.Size = new Size(350, 465);\\n', s, count=1)
              if n != 1: raise SystemExit('grid size anchor not found')

          # Ensure the stock grid starts below the portfolio selector.
          s = s.replace('            stocksDataGridView.Location = new Point(8, 48);\n', '            stocksDataGridView.Location = new Point(8, 42);\n', 1)

          # Restore control-tab RTL layout; this is important for the filter tab's designer geometry.
          anchor = '            controlTabControl.RightToLeft = RightToLeft.Yes;\n'
          if '            controlTabControl.RightToLeftLayout = true;\n' not in s:
              if anchor not in s: raise SystemExit('control tab RTL anchor not found')
              s = s.replace(anchor, anchor + '            controlTabControl.RightToLeftLayout = true;\n', 1)

          # Put the bottom stock container into the tab and remove the old direct group.
          old_controls = '''            stocksTabPage.Controls.Add(portfolioLabel);\n            stocksTabPage.Controls.Add(portfolioComboBox);\n            stocksTabPage.Controls.Add(stocksDataGridView);\n            stocksTabPage.Controls.Add(groupBox1);\n'''
          new_controls = '''            stocksTabPage.Controls.Add(stocksDataGridView);\n            stocksTabPage.Controls.Add(stockControlsPanel);\n            stocksTabPage.Controls.Add(portfolioComboBox);\n            stocksTabPage.Controls.Add(portfolioLabel);\n'''
          if old_controls in s:
              s = s.replace(old_controls, new_controls, 1)

          # Portfolio selector geometry remains the compact, visible layout.
          s = s.replace('            portfolioComboBox.Location = new Point(88, 8);\n', '            portfolioComboBox.Location = new Point(88, 8);\n', 1)

          # Complete disposal/layout for the newly restored containers.
          end_anchor = '            groupBox1.ResumeLayout(false);\n'
          if '            stockOptionsPanel.ResumeLayout(false);\n' not in s:
              if end_anchor not in s: raise SystemExit('resume anchor not found')
              s = s.replace(end_anchor, '            stockOptionsPanel.ResumeLayout(false);\n            stockOptionsPanel.PerformLayout();\n            stockButtonsPanel.ResumeLayout(false);\n            stockControlsPanel.ResumeLayout(false);\n' + end_anchor, 1)

          # The groupBox is obsolete in the restored layout; leave its controls detached and hidden.
          s = s.replace('            groupBox1.Visible = true;\n', '            groupBox1.Visible = false;\n')

          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-mainform-layout.yml
          git add MainForm.Designer.cs .github/workflows/fix-mainform-layout.yml
          git commit -m "Restore stock controls and filter tab layout"
          git push origin HEAD:main
