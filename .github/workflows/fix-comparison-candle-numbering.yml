name: Fix comparison candle numbering

on:
  push:
    branches:
      - fix-comparison-candle-numbering

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch comparison filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('MainForm.cs')
          text = path.read_text(encoding='utf-8')

          old_tuple = '(comparisonFirstComboBox2, comparisonOperatorComboBox1, comparisonSecondComboBox2, comparisonFirstTextBox1, comparisonSecondTextBox1)'
          new_tuples = '''(comparisonFirstComboBox1, comparisonOperatorComboBox1, comparisonSecondComboBox1, comparisonFirstTextBox1, comparisonSecondTextBox1),
                (comparisonFirstComboBox2, comparisonOperatorComboBox2, comparisonSecondComboBox2, comparisonFirstTextBox2, comparisonSecondTextBox2),
                (comparisonFirstComboBox3, comparisonOperatorComboBox3, comparisonSecondComboBox3, comparisonFirstTextBox3, comparisonSecondTextBox3)'''
          count = text.count(old_tuple + ',\n                ' + old_tuple)
          if count == 0:
              raise SystemExit('Duplicate comparison filter tuple block not found')
          text = text.replace(old_tuple + ',\n                ' + old_tuple, new_tuples)

          old_apply_pattern = re.compile(r'(?P<indent>\s*)int totalOffset;\s*\n\s*try \{ totalOffset = checked\(firstOffset \+ relativeOffset\); \} catch \(OverflowException\) \{ return Enumerable\.Empty<string>\(\); \}\s*\n\s*return symbols\.Where\(symbol => TryGetComparisonValues\(definition, symbol, firstField, secondField, firstOffset, totalOffset, out var left, out var right\) && CompareComparisonOperator\(left, right, op\)\);')
          text, count = old_apply_pattern.subn(r'\g<indent>return symbols.Where(symbol => TryGetComparisonValues(definition, symbol, firstField, secondField, firstOffset, relativeOffset, out var left, out var right) && CompareComparisonOperator(left, right, op));', text, count=1)
          if count != 1:
              raise SystemExit(f'ApplyComparisonFilter replacement count={count}')

          old_indices_pattern = re.compile(r'var firstIndex = rows\.Count - 1 - firstOffset;\s*\n\s*var secondIndex = rows\.Count - 1 - secondOffset;\s*\n\s*if \(firstIndex < 0 \|\| secondIndex < 0 \|\| firstIndex >= rows\.Count \|\| secondIndex >= rows\.Count\) return false;')
          new_indices = '''var firstIndex = rows.Count - firstOffset;
            var secondIndex = rows.Count - secondOffset;
            if (firstOffset <= 0 || secondOffset <= 0 || firstIndex < 0 || secondIndex < 0 || firstIndex >= rows.Count || secondIndex >= rows.Count) return false;'''
          text, count = old_indices_pattern.subn(new_indices, text, count=1)
          if count != 1:
              raise SystemExit(f'Comparison index replacement count={count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.cs
          git diff --cached --check
          git commit -m "Fix comparison filters to use 1-based candle numbers"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-comparison-candle-numbering.yml
          git commit -m "Remove temporary comparison filter workflow"
          git push
