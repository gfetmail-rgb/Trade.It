name: Repair stock preview and main stock tab layout

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused UI fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Single-click a symbol row in the portfolio definition form
          #    loads that symbol's file into the existing Designer preview grid.
          p = Path("PortfolioDefinitionForm.cs")
          text = p.read_text(encoding="utf-8-sig")
          old = '            symbolGrid.CellDoubleClick += SymbolGrid_CellDoubleClick;\n'
          new = old + '            symbolGrid.CellClick += SymbolGrid_CellClick;\n'
          if 'symbolGrid.CellClick += SymbolGrid_CellClick;' not in text:
              if old not in text:
                  raise SystemExit("PortfolioDefinitionForm.cs anchor not found")
              text = text.replace(old, new, 1)
          marker = '        private void SymbolGrid_CellDoubleClick(object? sender, DataGridViewCellEventArgs e)\n'
          method = '''        private void SymbolGrid_CellClick(object? sender, DataGridViewCellEventArgs e)\n        {\n            if (e.RowIndex < 0 || e.RowIndex >= symbolGrid.Rows.Count) return;\n            var file = symbolGrid.Rows[e.RowIndex].Tag as string;\n            if (!string.IsNullOrWhiteSpace(file) && File.Exists(file)) LoadPreview(file);\n        }\n\n'''
          if 'private void SymbolGrid_CellClick(' not in text:
              if marker not in text:
                  raise SystemExit("SymbolGrid_CellDoubleClick anchor not found")
              text = text.replace(marker, method + marker, 1)
          p.write_text(text, encoding="utf-8")

          # 2) Repair the main form's Stocks tab. The portfolio selector had not
          #    been parented to the tab and the top-docked control group overlapped it.
          p = Path("MainForm.Designer.cs")
          text = p.read_text(encoding="utf-8-sig")

          old = '''            stocksTabPage.Controls.Add(groupBox1);\n            stocksTabPage.Controls.Add(stocksDataGridView);\n'''
          new = '''            stocksTabPage.Controls.Add(portfolioLabel);\n            stocksTabPage.Controls.Add(portfolioComboBox);\n            stocksTabPage.Controls.Add(stocksDataGridView);\n            stocksTabPage.Controls.Add(groupBox1);\n'''
          if old not in text:
              raise SystemExit("stocks tab controls anchor not found")
          text = text.replace(old, new, 1)

          old = '''            groupBox1.Dock = DockStyle.Top;\n            groupBox1.Location = new Point(8, 8);\n            groupBox1.Name = "groupBox1";\n            groupBox1.Size = new Size(344, 96);\n'''
          new = '''            groupBox1.Anchor = AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            groupBox1.Dock = DockStyle.None;\n            groupBox1.Location = new Point(8, 683);\n            groupBox1.Name = "groupBox1";\n            groupBox1.Size = new Size(344, 96);\n'''
          if old not in text:
              raise SystemExit("groupBox1 layout anchor not found")
          text = text.replace(old, new, 1)

          old = '''            stocksDataGridView.Dock = DockStyle.Fill;\n            stocksDataGridView.Location = new Point(8, 104);\n            stocksDataGridView.Name = "stocksDataGridView";\n            stocksDataGridView.Size = new Size(344, 675);\n'''
          new = '''            stocksDataGridView.Anchor = AnchorStyles.Top | AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            stocksDataGridView.Dock = DockStyle.None;\n            stocksDataGridView.Location = new Point(8, 48);\n            stocksDataGridView.Name = "stocksDataGridView";\n            stocksDataGridView.Size = new Size(344, 627);\n'''
          if old not in text:
              raise SystemExit("stocks grid layout anchor not found")
          text = text.replace(old, new, 1)

          old = '''            portfolioComboBox.DropDownStyle = ComboBoxStyle.DropDownList;\n            portfolioComboBox.Location = new Point(108, 8);\n            portfolioComboBox.Name = "portfolioComboBox";\n            portfolioComboBox.Size = new Size(236, 33);\n'''
          new = '''            portfolioComboBox.DropDownStyle = ComboBoxStyle.DropDownList;\n            portfolioComboBox.Location = new Point(88, 8);\n            portfolioComboBox.Name = "portfolioComboBox";\n            portfolioComboBox.Size = new Size(256, 33);\n            portfolioComboBox.Anchor = AnchorStyles.Top | AnchorStyles.Left | AnchorStyles.Right;\n'''
          if old not in text:
              raise SystemExit("portfolio combo layout anchor not found")
          text = text.replace(old, new, 1)

          old = '''            portfolioLabel.Anchor = AnchorStyles.Top | AnchorStyles.Right;\n            portfolioLabel.AutoSize = true;\n            portfolioLabel.Location = new Point(446, 12);\n            portfolioLabel.Name = "portfolioLabel";\n            portfolioLabel.Size = new Size(46, 25);\n'''
          new = '''            portfolioLabel.Anchor = AnchorStyles.Top | AnchorStyles.Left;\n            portfolioLabel.AutoSize = true;\n            portfolioLabel.Location = new Point(8, 12);\n            portfolioLabel.Name = "portfolioLabel";\n            portfolioLabel.Size = new Size(70, 25);\n            portfolioLabel.TextAlign = ContentAlignment.MiddleRight;\n'''
          if old not in text:
              raise SystemExit("portfolio label layout anchor not found")
          text = text.replace(old, new, 1)

          # Keep the controls inside the bottom group readable in two compact rows.
          overrides = '''            navigationButton.Location = new Point(10, 15);\n            navigationButton.Size = new Size(68, 32);\n            refreshButton.Location = new Point(82, 15);\n            refreshButton.Size = new Size(68, 32);\n            selectAllCheckBox.Location = new Point(154, 18);\n            selectAllCheckBox.Size = new Size(76, 28);\n            selectNoneCheckBox.Location = new Point(234, 18);\n            selectNoneCheckBox.Size = new Size(98, 28);\n            speedLabel.Location = new Point(10, 55);\n            navigationSpeedTextBox.Location = new Point(82, 52);\n            navigationSpeedTextBox.Size = new Size(48, 31);\n            newPortfolioButton.Location = new Point(136, 52);\n            newPortfolioButton.Size = new Size(62, 32);\n            deleteButton.Location = new Point(202, 52);\n            deleteButton.Size = new Size(62, 32);\n            refreshButtonPortfolio.Location = new Point(268, 52);\n            refreshButtonPortfolio.Size = new Size(64, 32);\n'''
          anchor = '            groupBox1.Text = "کنترل سبد";\n'
          if anchor not in text:
              raise SystemExit("groupBox text anchor not found")
          if 'navigationButton.Location = new Point(10, 15);' not in text:
              text = text.replace(anchor, anchor + overrides, 1)

          p.write_text(text, encoding="utf-8")
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-stock-preview-ui.yml
          git add MainForm.cs MainForm.Designer.cs PortfolioDefinitionForm.cs .github/workflows/repair-stock-preview-ui.yml
          git commit -m "Fix stock preview click and stocks tab layout"
          git push origin HEAD:main
