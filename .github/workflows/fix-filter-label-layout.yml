name: Fix clipped filter labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix filter layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm.Designer.cs')
          s = p.read_text(encoding='utf-8-sig')
          changed = 0
          for name in ['label5', 'label5_6', 'label5_7', 'label5_8']:
              old = f'            {name}.Location = new Point(319, 36);'
              new = f'            {name}.Location = new Point(250, 36);'
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed == 0:
              raise SystemExit('No clipped filter label locations found')
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm.Designer.cs
          git commit -m "Fix clipped filter labels"
          git rm .github/workflows/fix-filter-label-layout.yml
          git commit -m "Remove temporary filter layout workflow"
          git push origin HEAD:main
