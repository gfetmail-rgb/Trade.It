name: Fix text drawing render order
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch text rendering
        shell: python
        run: |
          from pathlib import Path

          adv = Path('TradingChartControl.AdvancedDrawing.cs')
          s = adv.read_text(encoding='utf-8')
          marker = '        private void DrawAdvancedFibonacci(Graphics g, Pen pen, Brush labelBrush, AdvancedDrawing d, Rectangle plot, int visibleCountForDrawing, double min, double max)\n'
          method = '''        private void DrawAdvancedTextLabels(Graphics g, Rectangle plot, int visibleCountForDrawing, double min, double max)\n        {\n            SyncAdvancedDrawingData();\n\n            using var normalPen = new Pen(Color.FromArgb(45, 105, 170), 1.2f);\n            using var selectedPen = new Pen(Color.FromArgb(25, 75, 140), 2f);\n            using var labelBrush = new SolidBrush(Color.FromArgb(35, 35, 35));\n            using var labelBack = new SolidBrush(Color.FromArgb(245, 248, 252));\n\n            for (var i = 0; i < advancedDrawings.Count; i++)\n            {\n                var d = advancedDrawings[i];\n                if (d.Tool != AdvancedDrawingTool.TextLabel)\n                    continue;\n\n                var pen = i == selectedAdvancedDrawingIndex ? selectedPen : normalPen;\n                DrawAdvancedText(g, pen, labelBrush, labelBack, d, plot, visibleCountForDrawing, min, max);\n            }\n        }\n\n'''
          if 'private void DrawAdvancedTextLabels(' not in s:
              if marker not in s:
                  raise SystemExit('AdvancedDrawing marker not found')
              s = s.replace(marker, method + marker, 1)
              adv.write_text(s, encoding='utf-8')

          main = Path('TradingChartControl.cs')
          s = main.read_text(encoding='utf-8')
          old = '''            for (var i = 0; i <= 5; i++)\n            {\n                var value = max - (max - min) * i / 5.0;\n                var y = PriceToScreen(value, plot, min, max);\n                e.Graphics.DrawString(value.ToString("0.##"), axisTextFont, textBrush, plot.Right + 4, y - axisTextFont.Height / 2f);\n            }\n        }\n\n        private void DrawDrawings'''
          new = '''            for (var i = 0; i <= 5; i++)\n            {\n                var value = max - (max - min) * i / 5.0;\n                var y = PriceToScreen(value, plot, min, max);\n                e.Graphics.DrawString(value.ToString("0.##"), axisTextFont, textBrush, plot.Right + 4, y - axisTextFont.Height / 2f);\n            }\n\n            DrawAdvancedTextLabels(e.Graphics, plot, visible.Count, min, max);\n        }\n\n        private void DrawDrawings'''
          if old not in s:
              raise SystemExit('Main OnPaint marker not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradingChartControl.cs TradingChartControl.AdvancedDrawing.cs
          git commit -m "Fix text drawing render order"
          git rm .github/workflows/fix-text-render.yml
          git commit -m "Remove temporary text fix workflow"
          git push
