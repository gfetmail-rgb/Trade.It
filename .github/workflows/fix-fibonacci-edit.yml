name: Fix Fibonacci editing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Fibonacci editing behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('TradingChartControl.AdvancedDrawing.cs')
          s = p.read_text(encoding='utf-8')

          s = s.replace('private Point draggingAdvancedLastPoint;','private Point draggingAdvancedLastPoint;\n        private int draggingAdvancedHandle;')

          s = s.replace('advancedDrawings.Add(new AdvancedDrawing { Tool = AdvancedDrawingTool.FibonacciRetracement, X1 = x1, Y1 = y1, X2 = x2, Y2 = y2 });\n            selectedAdvancedDrawingIndex = advancedDrawings.Count - 1;', 'advancedDrawings.Add(new AdvancedDrawing { Tool = AdvancedDrawingTool.FibonacciRetracement, X1 = x1, Y1 = y1, X2 = x2, Y2 = y2 });\n            selectedAdvancedDrawingIndex = -1;')

          old = '''                var hit = HitTestAdvancedDrawing(e.Location, plot);\n                if (hit >= 0)\n                {\n                    selectedAdvancedDrawingIndex = hit;\n                    draggingAdvancedDrawingIndex = hit;\n                    draggingAdvancedLastPoint = e.Location;\n                    Focus();\n                    Invalidate();\n                    DeferAdvancedMouseState();\n                }'''
          new = '''                var hit = HitTestAdvancedDrawing(e.Location, plot, out var hitHandle);\n                if (hit >= 0)\n                {\n                    selectedAdvancedDrawingIndex = hit;\n                    draggingAdvancedDrawingIndex = hit;\n                    draggingAdvancedHandle = hitHandle;\n                    draggingAdvancedLastPoint = e.Location;\n                    Focus();\n                    Invalidate();\n                    DeferAdvancedMouseState();\n                }'''
          if old not in s: raise SystemExit('mouse down target not found')
          s = s.replace(old, new, 1)

          old = '''                    var dx = currentX - previousX;\n                    var dy = currentY - previousY;\n                    var d = advancedDrawings[draggingAdvancedDrawingIndex];\n                    d.X1 += dx;\n                    d.Y1 += dy;\n                    if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)\n                    {\n                        d.X2 += dx;\n                        d.Y2 += dy;\n                    }\n                    draggingAdvancedLastPoint = e.Location;'''
          new = '''                    var dx = currentX - previousX;\n                    var dy = currentY - previousY;\n                    var d = advancedDrawings[draggingAdvancedDrawingIndex];\n                    if (d.Tool == AdvancedDrawingTool.FibonacciRetracement && draggingAdvancedHandle == 1)\n                    {\n                        d.X1 = currentX;\n                        d.Y1 = currentY;\n                    }\n                    else if (d.Tool == AdvancedDrawingTool.FibonacciRetracement && draggingAdvancedHandle == 2)\n                    {\n                        d.X2 = currentX;\n                        d.Y2 = currentY;\n                    }\n                    else\n                    {\n                        d.X1 += dx;\n                        d.Y1 += dy;\n                        if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)\n                        {\n                            d.X2 += dx;\n                            d.Y2 += dy;\n                        }\n                    }\n                    draggingAdvancedLastPoint = e.Location;'''
          if old not in s: raise SystemExit('drag target not found')
          s = s.replace(old, new, 1)

          s = s.replace('draggingAdvancedLastPoint = Point.Empty;\n                if (AdvancedDrawingActive', 'draggingAdvancedLastPoint = Point.Empty;\n                draggingAdvancedHandle = 0;\n                if (AdvancedDrawingActive', 1)
          s = s.replace('draggingAdvancedLastPoint = Point.Empty;\n                Invalidate();\n                e.Handled', 'draggingAdvancedLastPoint = Point.Empty;\n                draggingAdvancedHandle = 0;\n                Invalidate();\n                e.Handled', 1)
          s = s.replace('draggingAdvancedLastPoint = Point.Empty;\n                Capture = false;', 'draggingAdvancedLastPoint = Point.Empty;\n            draggingAdvancedHandle = 0;\n                Capture = false;', 1)

          old = '''        private int HitTestAdvancedDrawing(Point location, Rectangle plot)\n        {\n            if (!TryGetAdvancedContext(out _, out var visibleCountForDrawing, out var min, out var max))\n                return -1;'''
          new = '''        private int HitTestAdvancedDrawing(Point location, Rectangle plot, out int handle)\n        {\n            handle = 0;\n            if (!TryGetAdvancedContext(out _, out var visibleCountForDrawing, out var min, out var max))\n                return -1;'''
          if old not in s: raise SystemExit('hit signature target not found')
          s = s.replace(old, new, 1)

          old = '''                var p1 = DataToScreen(d.X1, d.Y1, plot, visibleCountForDrawing, min, max);\n                if (DistanceToPoint(location, p1) <= 10f)\n                    return i;\n\n                if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)\n                {\n                    var p2 = DataToScreen(d.X2, d.Y2, plot, visibleCountForDrawing, min, max);\n                    if (DistanceToPoint(location, p2) <= 10f || DistanceToSegment(location, p1, p2) <= 6f)\n                        return i;'''
          new = '''                var p1 = DataToScreen(d.X1, d.Y1, plot, visibleCountForDrawing, min, max);\n                if (DistanceToPoint(location, p1) <= 10f)\n                {\n                    handle = d.Tool == AdvancedDrawingTool.FibonacciRetracement ? 1 : 0;\n                    return i;\n                }\n\n                if (d.Tool == AdvancedDrawingTool.FibonacciRetracement)\n                {\n                    var p2 = DataToScreen(d.X2, d.Y2, plot, visibleCountForDrawing, min, max);\n                    if (DistanceToPoint(location, p2) <= 10f)\n                    {\n                        handle = 2;\n                        return i;\n                    }\n                    if (DistanceToSegment(location, p1, p2) <= 6f)\n                    {\n                        handle = 0;\n                        return i;\n                    }'''
          if old not in s: raise SystemExit('hit body target not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradingChartControl.AdvancedDrawing.cs
          git diff --cached --quiet && exit 0
          git commit -m "Add Fibonacci selection, delete and endpoint editing"
          git push origin HEAD:main
