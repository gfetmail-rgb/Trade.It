name: Add stock preview

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Apply stock preview changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 - <<'PY'
          import json, urllib.request, base64, re

          owner_repo = 'gfetmail-rgb/Trade.It'
          branch = 'main'
          headers = {'Authorization': 'Bearer ' + __import__('os').environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}

          def get_file(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{owner_repo}/contents/{path}?ref={branch}', headers=headers)
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              content = base64.b64decode(data['content']).decode('utf-8')
              return content, data['sha']

          def put_file(path, content, sha, message):
              payload = json.dumps({'message': message, 'content': base64.b64encode(content.encode('utf-8')).decode('ascii'), 'sha': sha, 'branch': branch}).encode()
              req = urllib.request.Request(f'https://api.github.com/repos/{owner_repo}/contents/{path}', data=payload, method='PUT', headers={**headers, 'Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # MainForm.Designer.cs: add a Designer-created preview GroupBox + grid.
          path = 'MainForm.Designer.cs'
          text, sha = get_file(path)
          if 'stockPreviewGroup' not in text:
              text = text.replace(
                  'private System.Windows.Forms.DataGridView stocksDataGridView;\n',
                  'private System.Windows.Forms.DataGridView stocksDataGridView;\n        private System.Windows.Forms.GroupBox stockPreviewGroup;\n        private System.Windows.Forms.DataGridView stockPreviewGrid;\n        private System.Windows.Forms.DataGridViewTextBoxColumn previewRowColumn;\n        private System.Windows.Forms.DataGridViewTextBoxColumn previewSymbolColumn;\n        private System.Windows.Forms.DataGridViewTextBoxColumn previewLastTradeColumn;\n        private System.Windows.Forms.DataGridViewCheckBoxColumn previewSelectColumn;\n')
              text = text.replace(
                  'stocksDataGridView = new DataGridView();\n',
                  'stocksDataGridView = new DataGridView();\n            stockPreviewGroup = new GroupBox();\n            stockPreviewGrid = new DataGridView();\n            previewRowColumn = new DataGridViewTextBoxColumn();\n            previewSymbolColumn = new DataGridViewTextBoxColumn();\n            previewLastTradeColumn = new DataGridViewTextBoxColumn();\n            previewSelectColumn = new DataGridViewCheckBoxColumn();\n')
              text = text.replace(
                  '((System.ComponentModel.ISupportInitialize)stocksDataGridView).BeginInit();\n',
                  '((System.ComponentModel.ISupportInitialize)stocksDataGridView).BeginInit();\n            stockPreviewGroup.SuspendLayout();\n            ((System.ComponentModel.ISupportInitialize)stockPreviewGrid).BeginInit();\n')
              text = text.replace(
                  'stocksTabPage.Controls.Add(stocksDataGridView);\n            stocksTabPage.Controls.Add(groupBox1);',
                  'stocksTabPage.Controls.Add(stockPreviewGroup);\n            stocksTabPage.Controls.Add(stocksDataGridView);\n            stocksTabPage.Controls.Add(groupBox1);')
              text = text.replace(
                  'stocksDataGridView.Size = new Size(344, 627);',
                  'stocksDataGridView.Size = new Size(344, 310);')
              anchor = '''            // stockPreviewGroup\n            // \n            stockPreviewGroup.Anchor = AnchorStyles.Top | AnchorStyles.Bottom | AnchorStyles.Left | AnchorStyles.Right;\n            stockPreviewGroup.Location = new Point(8, 365);\n            stockPreviewGroup.Name = "stockPreviewGroup";\n            stockPreviewGroup.Size = new Size(344, 310);\n            stockPreviewGroup.TabIndex = 4;\n            stockPreviewGroup.TabStop = false;\n            stockPreviewGroup.Text = "پیش نمایش";\n            // \n            // stockPreviewGrid\n            // \n            stockPreviewGrid.AllowUserToAddRows = false;\n            stockPreviewGrid.AllowUserToDeleteRows = false;\n            stockPreviewGrid.Dock = DockStyle.Fill;\n            stockPreviewGrid.BackgroundColor = SystemColors.Window;\n            stockPreviewGrid.ColumnHeadersHeight = 34;\n            stockPreviewGrid.Columns.AddRange(new DataGridViewColumn[] { previewRowColumn, previewSymbolColumn, previewLastTradeColumn, previewSelectColumn });\n            stockPreviewGrid.Name = "stockPreviewGrid";\n            stockPreviewGrid.ReadOnly = true;\n            stockPreviewGrid.RightToLeft = RightToLeft.Yes;\n            stockPreviewGrid.RowHeadersVisible = false;\n            stockPreviewGrid.SelectionMode = DataGridViewSelectionMode.FullRowSelect;\n            stockPreviewGrid.TabIndex = 0;\n            // \n            // previewRowColumn\n            // \n            previewRowColumn.HeaderText = "ردیف";\n            previewRowColumn.Name = "previewRowColumn";\n            previewRowColumn.ReadOnly = true;\n            previewRowColumn.Width = 55;\n            // \n            // previewSymbolColumn\n            // \n            previewSymbolColumn.HeaderText = "نماد";\n            previewSymbolColumn.Name = "previewSymbolColumn";\n            previewSymbolColumn.ReadOnly = true;\n            previewSymbolColumn.Width = 75;\n            // \n            // previewLastTradeColumn\n            // \n            previewLastTradeColumn.AutoSizeMode = DataGridViewAutoSizeColumnMode.Fill;\n            previewLastTradeColumn.HeaderText = "آخرین معامله";\n            previewLastTradeColumn.Name = "previewLastTradeColumn";\n            previewLastTradeColumn.ReadOnly = true;\n            // \n            // previewSelectColumn\n            // \n            previewSelectColumn.HeaderText = "انتخاب";\n            previewSelectColumn.Name = "previewSelectColumn";\n            previewSelectColumn.ReadOnly = true;\n            previewSelectColumn.Width = 60;\n            stockPreviewGroup.Controls.Add(stockPreviewGrid);\n            // \n'''
              text = text.replace('            rowColumn.HeaderText = "ردیف";\n', anchor + '            rowColumn.HeaderText = "ردیف";\n')
              text = text.replace(
                  '            ((System.ComponentModel.ISupportInitialize)stocksDataGridView).EndInit();\n',
                  '            ((System.ComponentModel.ISupportInitialize)stockPreviewGrid).EndInit();\n            stockPreviewGroup.ResumeLayout(false);\n            ((System.ComponentModel.ISupportInitialize)stocksDataGridView).EndInit();\n')
              put_file(path, text, sha, 'Add stock preview grid to main form')

          # MainForm.cs: single-click a stock row to copy its data into the preview grid.
          path = 'MainForm.cs'
          text, sha = get_file(path)
          if 'StocksDataGridView_CellClick' not in text:
              text = text.replace(
                  '            refreshButtonPortfolio.Click += RefreshPortfolioButton_Click;\n',
                  '            refreshButtonPortfolio.Click += RefreshPortfolioButton_Click;\n            stocksDataGridView.CellClick += StocksDataGridView_CellClick;\n')
              marker = '        private void PopulateStocksGrid(PortfolioDefinition definition)\n'
              method = '''        private void StocksDataGridView_CellClick(object? sender, DataGridViewCellEventArgs e)\n        {\n            if (e.RowIndex < 0 || e.RowIndex >= stocksDataGridView.Rows.Count)\n                return;\n\n            var sourceRow = stocksDataGridView.Rows[e.RowIndex];\n            if (sourceRow.IsNewRow)\n                return;\n\n            stockPreviewGrid.Rows.Clear();\n            stockPreviewGrid.Rows.Add(\n                sourceRow.Cells["rowColumn"].Value,\n                sourceRow.Cells["symbolColumn"].Value,\n                sourceRow.Cells["lastTradeColumn"].Value,\n                sourceRow.Cells["selectColumn"].Value);\n        }\n\n'''
              if marker not in text:
                  raise SystemExit('PopulateStocksGrid marker not found')
              text = text.replace(marker, method + marker)
              put_file(path, text, sha, 'Show selected stock in preview grid')

          # Remove this temporary workflow so the repository stays clean.
          workflow = '.github/workflows/add-stock-preview.yml'
          text, sha = get_file(workflow)
          put_file(workflow, '', sha, 'Remove temporary stock preview workflow')
          # The empty file is intentionally removed by the next API call below using git data is not available here.
          # Instead, leave a minimal inert workflow only if deletion cannot be performed by contents API in this step.
          PY
          # Remove the temporary workflow through the contents API.
          python3 - <<'PY'
          import json, urllib.request, os
          path='.github/workflows/add-stock-preview.yml'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          req=urllib.request.Request(f'https://api.github.com/repos/gfetmail-rgb/Trade.It/contents/{path}?ref=main',headers=h)
          with urllib.request.urlopen(req) as r: d=json.load(r)
          payload=json.dumps({'message':'Remove temporary stock preview workflow','sha':d['sha'],'branch':'main'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/gfetmail-rgb/Trade.It/contents/{path}',data=payload,method='DELETE',headers={**h,'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: print(r.read().decode())
          PY
